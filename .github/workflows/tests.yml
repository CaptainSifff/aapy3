name: A-A-P tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated standalone bundle
        run: |
          python tests/tools/build_standalone.py --check
          python tests/tools/build_standalone.py --self-check
      - name: Check Python 3.4 compatibility
        run: python tests/tools/check_frontend_py34.py
      - name: Run test suites
        env:
          PYTHONPATH: tests/src:tests/semantics:tests/adapters:tests/tools
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run recursive CLI tests
        run: python tests/adapters/test_cli_stdout.py
